# Feedback Dashboard Worker
name = "feedback"
main = "worker.js"
compatibility_date = "2026-01-08"
workers_dev = true

# Optional: uncomment to use custom domain
routes = [
  { pattern = "feedback.f1genz.dev", custom_domain = true }
]

# Static Assets (HTML/CSS/JS)
[assets]
directory = "./public"

# Secret (set via: echo "<KEY>" | wrangler secret put API_KEY)
# Must match server .env API_KEY. Do NOT hardcode keys in worker.js.

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "f1genz-images"
